apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barq
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mazenhassan20/BARQ-Task.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: barq
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
