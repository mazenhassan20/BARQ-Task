# SAFE EXAMPLE ONLY - fake values. Do NOT put real credentials here.
# Create the real secret on the control plane instead:
#   kubectl -n barq-project create secret generic barq-secret \
#     --from-literal=DB_USER='<rds-username>' \
#     --from-literal=DB_PASSWORD='<rds-password>'
apiVersion: v1
kind: Secret
metadata:
  name: barq-secret
  namespace: barq-project
type: Opaque
stringData:
  DB_USER: "change-me"
  DB_PASSWORD: "change-me"
