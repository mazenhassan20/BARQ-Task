# Lets you apply everything with:  kubectl apply -k k8s/
# (the Secret is created by deploy.sh from .env)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 01-config/configmap.yaml
  - 02-db-init/configmap.yaml
  - 02-db-init/job.yaml
  - 03-redis/pvc.yaml
  - 03-redis/deployment.yaml
  - 03-redis/service.yaml
  - 04-flask/deployment.yaml
  - 04-flask/service.yaml
  - 05-nginx/configmap.yaml
  - 05-nginx/deployment.yaml
  - 05-nginx/service.yaml
  - 06-networkpolicy.yaml



images:
  - name: docker.io/zinabelamir/barq-app
    newTag: 31d3f8e
