apiVersion: apps/v1
kind: Deployment
metadata: { name: nginx, namespace: barq-project }
spec:
  replicas: 2
  selector: { matchLabels: { app: nginx } }
  template:
    metadata: { labels: { app: nginx } }
    spec:
      tolerations:
        - {
            key: node-role.kubernetes.io/control-plane,
            operator: Exists,
            effect: NoSchedule,
          }
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - {
                name: conf,
                mountPath: /etc/nginx/nginx.conf,
                subPath: nginx.conf,
              }
          readinessProbe:
            { httpGet: { path: /health, port: 80 }, periodSeconds: 5 }
          livenessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
      volumes:
        - name: conf
          configMap: { name: nginx-conf }
