apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: barq-project }
spec:
  replicas: 1
  strategy: { type: Recreate } # RWO volume: old pod must stop before the new one starts
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      nodeSelector:
        redis-storage: "true"
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            [redis-server, --dir, /data, --appendonly, "yes", --save, "60 1"]
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            { exec: { command: [redis-cli, ping] }, periodSeconds: 5 }
          livenessProbe:
            exec: { command: [redis-cli, ping] }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-data }
