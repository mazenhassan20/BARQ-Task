name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs_only
      - '**.md'
      - 'docs/**'
      - 'images/**'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.svg'
      - 'LICENSE'
  pull_request:
    paths-ignore: *docs_only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/mazenhassan20/barq-app

jobs:
  build-start-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare synthetic environment file
        run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose build
      - run: docker compose up -d
      - run: python3 validate.py --host 127.0.0.1 --port 8090 --timeout 90
      - name: Show compose state and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -kubernetes-version 1.31.0 k8s/*.yaml
      - name: Syntax-check deploy script
        run: bash -n deploy.sh
      - name: Trivy secret scan (fails on findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
      - name: Trivy config scan of k8s manifests (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: k8s
          format: table
          exit-code: '0'

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.image == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect changes that affect the image
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            image:
              - 'app/**'
              - 'database/**'
              - 'nginx/**'
              - 'Dockerfile'
              - 'requirements*.txt'
              - '.dockerignore'

  image:
    needs: [build-start-validate, static-checks, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: barq-app:ci
      - name: Trivy image report (CRITICAL, HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: barq-app:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
      - name: Trivy gate (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: barq-app:ci
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=sha-,format=short
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
