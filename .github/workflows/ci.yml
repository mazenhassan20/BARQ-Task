name: CI

# Checks only. Nothing is pushed anywhere from this workflow.
# It runs only when something that can change behaviour or the deployment changes:
# README, docs, screenshots and the like never trigger it.
on:
  push:
    branches: [main, aws-terraform-ansible]
    paths: &relevant
      - "app/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements*.txt"
      - "docker-compose.yml"
      - "nginx/**"
      - "database/**"
      - "validate.py"
      - ".env.example"
      - "manifests/**"
      - "terraform/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *relevant
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build-start-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare synthetic environment file
        run: cp .env.example .env

      - name: Compose / syntax check
        run: docker compose config -q

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for readiness and validate
        run: python3 validate.py --host 127.0.0.1 --port 8090 --timeout 90

      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  manifests-and-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate rendered Kubernetes manifests (kustomize build)
        run: kubectl kustomize manifests/k8s | kubeconform -strict -summary -kubernetes-version 1.31.0 -

      - name: Syntax-check deploy script
        run: bash -n manifests/deploy.sh

      - name: Trivy secret scan (fails on findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"

      - name: Trivy config scan of manifests and Terraform (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "0"

  terraform-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  image-scan:
    runs-on: ubuntu-latest
    needs: [unit-tests, build-start-validate]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build app image for scanning
        run: docker build -t barq-app:ci .

      - name: Trivy report (CRITICAL, HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: barq-app:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy gate (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: barq-app:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
