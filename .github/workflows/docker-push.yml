name: Docker Push

# Build the app image and push it to Docker Hub.
# Runs ONLY on the aws-terraform-ansible branch, and ONLY when something that ends up
# inside the image changes (see the Dockerfile: app/, requirements.txt, the Dockerfile itself).
# README, manifests, Terraform, Ansible, tests and docs never trigger it.
on:
  push:
    branches: [aws-terraform-ansible]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a push that is already running; queue the next one instead.
concurrency:
  group: docker-push-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: zinabelamir/barq-app

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=,format=short

      # Build once locally and scan; a fixable CRITICAL stops the pipeline before anything is pushed.
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: barq-app:scan
          cache-from: type=gha

      - name: Trivy gate (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: barq-app:scan
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false # keeps the registry free of untagged attestation entries
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # GitOps hand-off: write the freshly pushed tag into the kustomization.
  # Argo CD watches this branch, sees the commit and rolls the Deployment.
  # Runs only after the image was pushed. The commit touches manifests/ only, which does not
  # trigger this workflow, and a push made with GITHUB_TOKEN does not trigger other workflows,
  # so there is no loop.
  deploy-tag:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Bump image tag in kustomization.yaml
        env:
          TAG: ${{ needs.build-push.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{7,}$ ]] || { echo "unexpected tag: $TAG"; exit 1; }
          FILE=manifests/k8s/kustomization.yaml
          sed -i "s|^\(\s*newTag:\).*|\1 ${TAG}|" "$FILE"
          git diff --quiet && { echo "tag already ${TAG}"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: deploy ${TAG}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:${BRANCH}"
