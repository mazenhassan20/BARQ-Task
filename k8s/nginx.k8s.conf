# Baseline NGINX config for Kubernetes.
# Merge any behaviour from nginx/nginx.conf (headers, limits, logging) that this does not cover.
worker_processes auto;
events { worker_connections 1024; }

http {
  upstream barq_app {
    # "app" is the Kubernetes Service name (load-balances across the 3 app pods)
    server app:8080;
  }

  server {
    listen 80;

    location = /health {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://barq_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }
  }
}
